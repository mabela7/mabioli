name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Android SDK 36
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: App icon (icon.png / icon.jpg / icon.jpeg)
        run: |
          f=$(ls icon.png icon.jpg icon.jpeg 2>/dev/null | head -n1)
          [ -n "$f" ] || { echo "no icon, default icon"; exit 0; }
          pip install pillow
          ICON="$f" python3 - <<'EOF'
          import os, shutil
          from PIL import Image, ImageDraw
          src = Image.open(os.environ['ICON']).convert('RGBA')
          w, h = src.size
          s = min(w, h)
          x, y = (w - s) // 2, (h - s) // 2
          src = src.crop((x, y, x + s, y + s))
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          for d, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              im = src.resize((px, px), Image.LANCZOS)
              im.save(f'{res}/mipmap-{d}/ic_launcher.png')
              m = Image.new('L', (px, px), 0)
              ImageDraw.Draw(m).ellipse((0, 0, px - 1, px - 1), fill=255)
              r = Image.new('RGBA', (px, px), (0, 0, 0, 0))
              r.paste(im, (0, 0), m)
              r.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          print('icon applied')
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk